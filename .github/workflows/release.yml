name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Validate release tag
        shell: bash
        run: |
          printf '%s\n' "$TAG_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test -f "docs/releases/$TAG_NAME.md"
      - name: Build release assets
        run: make dist VERSION="${TAG_NAME#v}"
      - name: Verify checksums and native installation
        shell: bash
        run: |
          (cd dist && sha256sum -c "sessh_${TAG_NAME#v}_checksums.txt")
          sh dist/install.sh --from-dir dist --bin-dir "$RUNNER_TEMP/sessh-release"
          "$RUNNER_TEMP/sessh-release/sessh" --version | grep -F "sessh version ${TAG_NAME#v}"
      - name: Upload and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${TAG_NAME#v}
          flags=()
          if [[ "$version" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          else
            flags+=(--latest)
          fi
          gh release create "$TAG_NAME" \
            dist/sessh_"${version}"_*.tar.gz \
            "dist/sessh_${version}_checksums.txt" dist/install.sh dist/setup-browser.sh \
            --verify-tag --draft --title "sessh $TAG_NAME" \
            --notes-file "docs/releases/$TAG_NAME.md" "${flags[@]}"
          gh release edit "$TAG_NAME" --draft=false "${flags[@]}"
