name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make check
      - name: Package and verify installation
        shell: bash
        run: |
          TARGETS="$(go env GOOS)/$(go env GOARCH)" make dist VERSION=0.0.0-ci
          export SESSH_RELEASE_DIR=dist SESSH_INSTALL_DIR="$RUNNER_TEMP/sessh-install"
          sh dist/install.sh
          "$RUNNER_TEMP/sessh-install/sessh" --version | grep -F 'sessh version 0.0.0-ci'
          export SESSH_HOME="$RUNNER_TEMP/sessh-state"
          "$RUNNER_TEMP/sessh-install/sessh" --help
          "$RUNNER_TEMP/sessh-install/sessh" auth list
          "$RUNNER_TEMP/sessh-install/sessh" teams schema -f json
          printf 'corrupt' >> dist/sessh_*.tar.gz
          if sh dist/install.sh; then
            echo 'Installer accepted a corrupt archive' >&2
            exit 1
          fi
          "$RUNNER_TEMP/sessh-install/sessh" --version | grep -F 'sessh version 0.0.0-ci'

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build release assets
        run: |
          printf '%s\n' "$TAG_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          make dist VERSION="${TAG_NAME#v}"
          (cd dist && sha256sum -c "sessh_${TAG_NAME#v}_checksums.txt")
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--latest)
          if [[ "$TAG_NAME" == *-* ]]; then flags=(--prerelease --latest=false); fi
          gh release create "$TAG_NAME" dist/* --verify-tag --draft \
            --title "sessh $TAG_NAME" --generate-notes "${flags[@]}"
          gh release edit "$TAG_NAME" --draft=false "${flags[@]}"
